<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tie-Dye Studio">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffe3f1">
  <title>Elaras Tie-Dye Studio</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../../icons/icon.svg">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- Start -->
  <section id="screen-home" class="screen active">
    <div class="logo"><span class="l1">ELARAS</span><span class="l2">TIE-DYE STUDIO</span></div>
    <div class="home-main">
      <div class="home-art"><img id="home-art" alt=""></div>
      <div class="home-actions">
        <button class="big" id="btn-free"><span class="em">🎨</span><b>Frei gestalten</b><small>Mach, was du willst!</small></button>
        <button class="big" id="btn-shop"><span class="em">🛍️</span><b>Mein Laden</b><small>Kunden haben Wünsche</small></button>
        <button class="big" id="btn-closet"><span class="em">👚</span><b>Mein Schrank</b><small id="closet-count"></small></button>
      </div>
    </div>
    <div class="row">
      <button id="btn-hub" class="btn">◀ Alle Spiele</button>
      <span class="stars-pill" id="home-stars"></span>
      <button id="btn-sound" class="btn round" aria-label="Ton an/aus">🔊</button>
    </div>
  </section>

  <!-- Kunde -->
  <section id="screen-customer" class="screen">
    <h1>Kundschaft! <span class="stars-pill small" id="cust-stars"></span></h1>
    <div class="customer">
      <div class="cust-face" id="cust-face"></div>
      <div class="bubble">
        <p id="cust-text"></p>
        <img id="cust-wish" alt="">
      </div>
    </div>
    <div class="row">
      <button class="btn" data-go="home">◀ Zurück</button>
      <button class="btn" id="btn-other">🔄 Anderer Kunde</button>
      <button class="btn primary" id="btn-accept">Mach ich! ▶</button>
    </div>
  </section>

  <!-- Kleidungsstück -->
  <section id="screen-garment" class="screen">
    <h1>Was möchtest du färben?</h1>
    <div id="garment-cards" class="cards"></div>
    <div class="row"><button class="btn" data-go="home">◀ Zurück</button></div>
  </section>

  <!-- Technik -->
  <section id="screen-tech" class="screen">
    <h1>Wie willst du falten?</h1>
    <div id="tech-cards" class="cards"></div>
    <div class="row"><button class="btn" id="btn-tech-back">◀ Zurück</button></div>
  </section>

  <!-- Werkbank -->
  <section id="screen-work" class="screen work">
    <header class="work-top">
      <button id="btn-quit" class="btn round" aria-label="Aufhören">✕</button>
      <div id="steps" class="steps"></div>
      <img id="wish-mini" class="wish-mini" alt="">
    </header>
    <div id="hint" class="hint"></div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <footer class="work-bar">
      <button id="btn-undo" class="btn round" aria-label="Rückgängig">↺</button>
      <div id="palette" class="palette"></div>
      <button id="btn-next" class="btn primary">Weiter ▶</button>
    </footer>
  </section>

  <!-- Fertig -->
  <section id="screen-done" class="screen">
    <div class="done">
      <canvas id="done-cv"></canvas>
      <div class="done-side">
        <div id="done-face" class="cust-face small"></div>
        <p id="done-msg" class="done-msg"></p>
        <div id="done-stars" class="done-stars"></div>
        <div class="col">
          <button class="btn primary" id="btn-again">🔁 Nochmal!</button>
          <button class="btn" id="btn-save">💾 Bild speichern</button>
          <button class="btn" data-go="closet">👚 Mein Schrank</button>
          <button class="btn" data-go="home">🏠 Start</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Schrank -->
  <section id="screen-closet" class="screen">
    <h1>Mein Schrank</h1>
    <div id="closet-grid" class="closet"></div>
    <div class="row"><button class="btn" data-go="home">◀ Zurück</button></div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="confetti" aria-hidden="true"></div>
  <div id="toast"></div>

  <script type="module" src="./js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('../../sw.js', { scope: '../../' }).catch(() => {}));
    }
  </script>
</body>
</html>
