<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Angler-Pose</title>
<style>html,body{margin:0;background:#888;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../../../vendor/three.module.js","three/addons/":"../../../vendor/addons/"}}</script>
</head><body>
<script type="module">
// Entwickler-Ansicht der Angler-Figur: ?view=back|front|side|hand  &cast=-1..1  &look={json}  &rod=pose
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { preloadAngler, createAngler } from '../js/angler.js';
import { DEFAULT_LOOK } from '../js/data.js';
const qs = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8fa6bb);
const pm = new THREE.PMREMGenerator(r);
new RGBELoader().load('../assets/sky/noon.hdr', (t) => { t.mapping = THREE.EquirectangularReflectionMapping; scene.environment = pm.fromEquirectangular(t).texture; });
const sun = new THREE.DirectionalLight(0xfff4e0, 2.2); sun.position.set(3, 6, 4); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x6a7a5a })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.02, 100);
const V = { back: [[-0.9, 1.9, -2.6], [0, 1.2, 0.8]], front: [[1.2, 1.5, 3.2], [0, 1.1, 0]], side: [[-3.2, 1.4, 0.6], [0, 1.3, 0.6]], hand: [[-0.9, 1.4, 1.0], [-0.17, 1.02, 0.3]], wide: [[-1.6, 2.4, -4], [0, 1.6, 2]] };
const [p, t] = V[qs.get('view') || 'back']; cam.position.set(...p); cam.lookAt(...t);
await preloadAngler();
const look = { ...DEFAULT_LOOK, ...JSON.parse(qs.get('look') || '{}') };
const a = createAngler(look, qs.get('rod') || 'pose', { lifeJacket: qs.has('lj') });
a.userData.rig.cast = +(qs.get('cast') || 0);
a.userData.rig.reeling = qs.has('reel');
scene.add(a);
let last = performance.now();
(function loop(now) { const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; a.userData.update(dt); r.render(scene, cam); requestAnimationFrame(loop); })(last);
</script></body></html>
