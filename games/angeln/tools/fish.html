<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><title>Fische</title>
<style>html,body{margin:0;background:#6a8090;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../../../vendor/three.module.js","three/addons/":"../../../vendor/addons/"}}</script>
</head><body>
<script type="module">
// Entwickler-Ansicht: alle Fischarten nebeneinander (für Screenshots)
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { createFish } from '../js/fishmodel.js';
import { FISH_IDS, FISH } from '../js/data.js';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6a8090);
const pm = new THREE.PMREMGenerator(r);
new RGBELoader().load('../assets/sky/noon.hdr', (t) => { t.mapping = THREE.EquirectangularReflectionMapping; scene.environment = pm.fromEquirectangular(t).texture; });
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1, 3, 4); scene.add(sun);
const cam = new THREE.OrthographicCamera(-2.1, 2.1, 1.35, -1.35, 0.1, 20); cam.position.set(0, 0.4, 5); cam.lookAt(0, 0, 0);
FISH_IDS.forEach((id, i) => { const f = createFish(id); f.position.set(-1.5 + (i % 4) * 1.0, 1.0 - Math.floor(i / 4) * 0.62, 0); f.rotation.y = -0.25; f.scale.setScalar(0.85); scene.add(f); });
(function loop() { r.render(scene, cam); requestAnimationFrame(loop); })();
</script></body></html>
